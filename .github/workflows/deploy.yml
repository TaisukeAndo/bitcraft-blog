name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch: {}
concurrency:
  group: deploy-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: check
        run: |
          if git diff --name-only HEAD^ HEAD | grep -q '^terraform/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
  terraform-apply:
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform init -input=false
      - run: terraform apply -input=false -auto-approve
  deploy-workers:
    needs: [changes, terraform-apply]
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (needs.terraform-apply.result == 'success' || needs.terraform-apply.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply D1 migrations
        run: pnpm --filter @bitcraft/blog-api exec wrangler d1 migrations apply bitcraft-blog --remote
      - name: Deploy apps/api
        run: pnpm --filter @bitcraft/blog-api exec wrangler deploy
      - name: Deploy apps/mcp
        run: pnpm --filter @bitcraft/blog-mcp exec wrangler deploy
      - name: Deploy apps/web
        run: pnpm --filter @bitcraft/blog-web exec wrangler deploy
      - name: Smoke test
        run: |
          set -e
          curl -sf https://blog-api.bitcraft.work/v1/health
          curl -sf -o /dev/null https://blog.bitcraft.work/
          status=$(curl -s -o /dev/null -w "%{http_code}" https://blog-mcp.bitcraft.work/mcp)
          if [ "$status" != "401" ]; then
            echo "expected 401 (unauthenticated) from /mcp, got $status" >&2
            exit 1
          fi
