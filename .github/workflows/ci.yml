name: CI
on:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Dry-run deploy (apps/api)
        run: pnpm --filter @bitcraft/blog-api exec wrangler deploy --dry-run
      - name: Dry-run deploy (apps/mcp)
        run: pnpm --filter @bitcraft/blog-mcp exec wrangler deploy --dry-run
      - name: Dry-run deploy (apps/web)
        run: pnpm --filter @bitcraft/blog-web exec wrangler deploy --dry-run
